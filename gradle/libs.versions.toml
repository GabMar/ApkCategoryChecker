[versions]
kotlin = "2.4.21"
shadow = "9.6.1"
junit = "6.1.3"

[libraries]
# Versions pinned to what the 2014 code was written against; upgraded in later phases.
commons-cli = "commons-cli:commons-cli:1.2"
commons-csv = "org.apache.commons:commons-csv:1.0"
json-simple = "com.googlecode.json-simple:json-simple:1.1.1"
commons-io = "commons-io:commons-io:2.4"
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
