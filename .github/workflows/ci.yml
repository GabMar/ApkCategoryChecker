name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build shadowJar

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ApkCategoryChecker
          path: build/libs/ApkCategoryChecker.jar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: apk-category-checker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "$PWD/src/test/resources/apks:/data" apk-category-checker:ci . -f jsonl | tee results.jsonl
          grep -q '"mainFramework":"Sencha"' results.jsonl
