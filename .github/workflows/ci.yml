name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build shadowJar

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ApkCategoryChecker
          path: build/libs/ApkCategoryChecker.jar
